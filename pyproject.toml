[project]
name = "fraudlab"
version = "0.1.0"
description = "Reproducible fraud-analytics research on synthetic data: generator, models, and evaluation."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Thanatchon Chongmankhong" }]
dependencies = [
    "numpy>=2.0",
    "polars>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
fraudlab = "fraudlab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudlab"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running tests (deselect with -m 'not slow')"]

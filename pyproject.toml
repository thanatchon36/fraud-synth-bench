[project]
name = "fraudlab"
version = "0.1.0"
description = "Reproducible fraud-analytics research on synthetic data: generator, models, and evaluation."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Thanatchon Chongmankhong" }]
dependencies = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "optuna>=5.0.0",
    "polars>=1.0",
    "psutil>=7.2.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "torch>=2.14.1",
]

[project.optional-dependencies]
# TabPFN weights need a one-time license acceptance (TABPFN_TOKEN). Never required
# for `make reproduce`; RQ1 includes TabPFN only when this extra is installed and
# the token is set. See docs/DECISIONS.md D019.
tabpfn = ["tabpfn>=9.2"]

[project.scripts]
fraudlab = "fraudlab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# `make paper`: pandoc (system) renders Markdown to Typst; this compiles it to PDF.
paper = [
    "typst>=0.15",
]

[tool.uv]
default-groups = ["dev", "paper"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudlab"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running tests (deselect with -m 'not slow')"]

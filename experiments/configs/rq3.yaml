# RQ3: graph models vs. tabular models with hand-crafted graph features.
name: rq3
protocol: standard
dataset:
  preset: small
  fraud_rate: 0.005
conditions:
  ring_share: [0.0, 0.25, 0.5, 0.75]
label_mode: oracle
seeds: [0, 1, 2, 3, 4]
models:
  - {name: lgbm_tuned, features: tabular}
  - {name: lgbm_tuned, features: tabular+graph, explain: true}
  - {name: graphsage, features: tabular}

# RQ4: label delay. Train [0, 50), valid [50, 60), deploy at day 60, test [60, 90).
name: rq4
protocol: delay
dataset:
  preset: small_long
  fraud_rate: 0.005
split_days: {valid: 50, test: 60}
conditions:
  label_mode: [oracle, delayed]
seeds: [0, 1, 2, 3, 4]
# LightGBM arms use 15 Optuna trials here (30 in RQ1) to fit the 90-minute budget (D028).
models:
  - logreg
  - {name: lgbm_tuned, params: {n_trials: 15}}
  - gru
  - {name: lgbm_semi, params: {n_trials: 15}}
